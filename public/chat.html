<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SkillUp Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- THEME VARIABLES (SkillUp Dark Theme) --- */
        :root {
            --bg-body: #111111;
            --bg-sidebar: #1e1e1e;
            --bg-card: #1e1e1e;
            --bg-header: #1e1e1e;
            --bg-input: #2d2d2d;
            
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #333333;
            
            /* The SkillUp Green */
            --primary-color: #1dbf73; 
            
            /* Message Bubbles */
            --msg-sent: #1dbf73;
            --msg-received: #2d2d2d;
            
            --danger-red: #ff5555;
            --quote-bg: rgba(0,0,0,0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        header {
            padding: 0 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-header);
            height: 70px;
        }
        .logo a { font-weight: 800; font-size: 22px; color: var(--text-main); text-decoration: none; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-size: 14px; transition: 0.2s; }
        .nav-link:hover { color: var(--primary-color); }

        /* --- LAYOUT --- */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 1200px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px; /* Rounded corners for modern look */
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 320px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--bg-sidebar);
        }
        .sidebar h3 { padding: 20px; font-size: 18px; font-weight: 700; color: var(--text-main); border-bottom: 1px solid var(--border); }
        .contact-list { flex: 1; overflow-y: auto; }
        
        .contact-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            transition: 0.2s;
            border-left: 4px solid transparent;
        }
        .contact-item:hover { background-color: #2a2a2a; }
        .contact-item.active { background-color: #2a2a2a; border-left-color: var(--primary-color); }

        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #444; margin-right: 15px; object-fit: cover;}
        .contact-info h4 { font-size: 15px; margin-bottom: 4px; color: var(--text-main); font-weight: 600;}
        .contact-info p { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}

        /* --- CHAT AREA --- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-body); /* Plain dark background */
            background-image: radial-gradient(#222 1px, transparent 1px); /* Subtle dot pattern */
            background-size: 20px 20px;
            position: relative;
        }

        .chat-header {
            padding: 0 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-header);
            height: 70px;
        }
        
        /* Messages Scroll Area */
        .messages {
            flex: 1;
            padding: 20px 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* --- MESSAGE BUBBLES --- */
        .message-row {
            display: flex;
            width: 100%;
            margin-bottom: 5px;
            position: relative;
        }
        .message-row.sent { justify-content: flex-end; }
        .message-row.received { justify-content: flex-start; }

        .message {
            max-width: 60%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14.5px;
            line-height: 1.5;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }
        
        .received .message { background-color: var(--msg-received); border-bottom-left-radius: 2px; }
        .sent .message { background-color: var(--msg-sent); color: #fff; border-bottom-right-radius: 2px; }

        .message img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .msg-time { font-size: 10px; opacity: 0.7; align-self: flex-end; margin-top: 5px; margin-left: 10px;}

        /* --- DROPDOWN ARROW (The Feature You Wanted) --- */
        .msg-dropdown-trigger {
            position: absolute;
            top: 0;
            right: 0;
            width: 25px;
            height: 25px;
            color: rgba(255,255,255,0.8);
            display: none; /* Hidden until hover */
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-top-right-radius: 12px; /* Match bubble corner */
            background: linear-gradient(to left, rgba(0,0,0,0.3), transparent);
        }
        
        /* Show arrow on hover */
        .message:hover .msg-dropdown-trigger { display: flex; }

        .msg-context-menu {
            display: none;
            position: absolute;
            top: 25px;
            right: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
            width: 140px;
            overflow: hidden;
            padding: 5px 0;
        }
        .msg-context-menu.show { display: block; }
        
        .msg-menu-item {
            padding: 10px 15px;
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .msg-menu-item:hover { background-color: #333; }
        .msg-menu-item.delete { color: var(--danger-red); }

        /* --- QUOTE / REPLY STYLES --- */
        .quoted-msg-container {
            background-color: rgba(0,0,0,0.2);
            border-left: 4px solid #fff;
            border-radius: 4px;
            padding: 6px 10px;
            margin-bottom: 8px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }
        .sent .quoted-msg-container { border-left-color: rgba(255,255,255,0.5); background-color: rgba(0,0,0,0.1); }
        .received .quoted-msg-container { border-left-color: var(--primary-color); }
        
        .quoted-author { font-weight: 700; margin-bottom: 2px; opacity: 0.9; }
        .quoted-text { opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- INPUT AREA & REPLY PREVIEW --- */
        .input-wrapper {
            background: var(--bg-header);
            display: flex;
            flex-direction: column;
            width: 100%;
            z-index: 20;
            border-top: 1px solid var(--border);
        }

        /* Reply Preview Bar */
        .reply-preview-bar {
            display: none; /* Hidden by default */
            background: #252525;
            padding: 12px 20px;
            border-left: 5px solid var(--primary-color);
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .preview-content { display: flex; flex-direction: column; width: 90%; }
        .preview-title { color: var(--primary-color); font-weight: 700; font-size: 13px; margin-bottom: 4px; }
        .preview-text { color: var(--text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .chat-input-area {
            padding: 15px;
            display: flex;
            align-items: center;
            background: var(--bg-header);
        }

        #msgInput {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: #fff;
            margin: 0 15px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }
        #msgInput:focus { border-color: var(--primary-color); }

        .btn-icon { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 8px; transition: 0.2s; }
        .btn-icon:hover { color: var(--primary-color); }
        
        .btn-send { 
            background-color: var(--primary-color); 
            color: #fff; 
            border: none; 
            width: 40px; height: 40px; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-send:hover { opacity: 0.9; }

        /* --- ATTACHMENT MENU --- */
        .attachment-container { position: relative; }
        .attachment-menu {
            display: none;
            position: absolute;
            bottom: 60px;
            left: 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 12px;
            width: 180px;
            padding: 8px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 100;
        }
        .attachment-menu.show { display: block; animation: popIn 0.1s ease; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .attachment-option { padding: 10px 20px; cursor: pointer; display: flex; align-items: center; color: var(--text-main); font-size: 14.5px; gap: 12px;}
        .attachment-option:hover { background-color: #333; }
        
        /* --- CHAT HEADER MENU --- */
        .header-menu-container { position: relative; }
        .header-menu {
            display: none;
            position: absolute;
            top: 40px;
            right: 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            width: 160px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 101;
            overflow: hidden;
            padding: 5px 0;
        }
        .header-menu.show { display: block; }
        .header-menu .msg-menu-item:hover { background-color: #333; }

        /* Empty State */
        .no-chat-selected { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); }
    </style>
</head>

<body>

    <header>
        <div class="logo"><a href="#">SkillUp</a></div>
        <nav>
            <a href="#" class="nav-link">Back to Market</a>
        </nav>
    </header>

    <div class="container">
        <div class="chat-container">
            
            <div class="sidebar">
                <h3>Messages</h3>
                <div class="contact-list" id="contactList"></div>
            </div>

            <div class="chat-area">
                <div class="chat-header" id="chatHeader">
                    <div id="headerInfo" style="display: flex; align-items: center;">
                        <img id="headerAvatar" src="" style="width: 40px; height: 40px; border-radius: 50%; display: none; margin-right: 15px;">
                        <div>
                            <span style="font-weight: 600; display: block;" id="chatName">Select a contact</span>
                            <span style="font-size: 12px; color: var(--text-muted);" id="chatStatus"></span>
                        </div>
                    </div>
                    
                    <div class="header-menu-container">
                        <button class="btn-icon" onclick="toggleHeaderMenu()"><i class="fas fa-ellipsis-v"></i></button>
                        <div class="header-menu" id="headerMenu">
                            <div class="msg-menu-item delete" onclick="deleteChat()">
                                <i class="fas fa-trash-alt"></i> Clear Chat
                            </div>
                        </div>
                    </div>
                </div>

                <div class="messages" id="messagesArea">
                    <div class="no-chat-selected">
                        <i class="far fa-comments" style="font-size: 60px; margin-bottom: 20px; opacity: 0.3;"></i>
                        <p style="font-size: 18px; color: var(--text-muted);">Select a conversation to start messaging</p>
                    </div>
                </div>

                <div class="input-wrapper">
                    
                    <div class="reply-preview-bar" id="replyPreview">
                        <div class="preview-content">
                            <span class="preview-title" id="replyTargetName">Replied User</span>
                            <span class="preview-text" id="replyTargetText">Message text...</span>
                        </div>
                        <button class="btn-icon" onclick="cancelReply()"><i class="fas fa-times"></i></button>
                    </div>

                    <div class="chat-input-area">
                        <div class="attachment-container">
                            <button class="btn-icon" onclick="toggleAttachmentMenu()"><i class="fas fa-paperclip"></i></button>
                            <div class="attachment-menu" id="attachmentMenu">
                                <div class="attachment-option" onclick="triggerFile('image')">
                                    <i class="fas fa-image" style="color: #d63384;"></i> Photos
                                </div> 
                                <div class="attachment-option" onclick="triggerFile('document')">
                                    <i class="fas fa-file-alt" style="color: #4facfe;"></i> Document
                                </div>
                            </div>
                        </div>
                        
                        <input type="file" id="fileInputImage" accept="image/*" style="display: none;" onchange="handleFileUpload(this, 'image')">
                        <input type="file" id="fileInputDoc" accept=".pdf,.doc,.docx,.txt" style="display: none;" onchange="handleFileUpload(this, 'document')">
                        
                        <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
                        
                        <button class="btn-send" onclick="sendTextMessage()"><i class="fas fa-paper-plane" style="font-size: 16px;"></i></button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- DATA & STATE ---
        const myId = "user_me";
        let activeReceiverId = null;
        let replyingToMsg = null; 

        // Initial Data
        const contacts = [
            { id: "c1", name: "Ayush Sinha", avatar: "https://ui-avatars.com/api/?name=Ayush+S&background=random&color=fff", status: "Online" },
            { id: "c2", name: "Dhairya P.", avatar: "https://ui-avatars.com/api/?name=Dhairya&background=random", status: "Last seen: 2h ago" },
        ];

        const messageStore = {
            "c1": [
                { id: 101, senderId: "c1", name: "Ayush Sinha", type: "text", content: "Hey! Did you check the new update?", timestamp: "10:30 AM" },
                { id: 102, senderId: "user_me", name: "You", type: "text", content: "Yes, looks amazing!", timestamp: "10:32 AM" }
            ],
            "c2": []
        };

        // --- RENDER ---
        document.addEventListener('DOMContentLoaded', renderContacts);

        function renderContacts() {
            const list = document.getElementById('contactList');
            list.innerHTML = contacts.map(c => `
                <div class="contact-item ${activeReceiverId === c.id ? 'active' : ''}" onclick="switchChat('${c.id}')">
                    <img src="${c.avatar}" class="avatar">
                    <div class="contact-info">
                        <h4>${c.name}</h4>
                        <p>${c.status}</p>
                    </div>
                </div>
            `).join('');
        }

        function switchChat(id) {
            activeReceiverId = id;
            cancelReply();
            renderContacts();
            
            const contact = contacts.find(c => c.id === id);
            document.getElementById('chatName').innerText = contact.name;
            document.getElementById('chatStatus').innerText = contact.status;
            document.getElementById('headerAvatar').src = contact.avatar;
            document.getElementById('headerAvatar').style.display = 'block';
            
            renderMessages();
        }

        function renderMessages() {
            const area = document.getElementById('messagesArea');
            const msgs = messageStore[activeReceiverId] || [];

            if (!activeReceiverId) return;

            if (msgs.length === 0) {
                area.innerHTML = `<div class="no-chat-selected"><p style="font-size:14px; background:rgba(255,255,255,0.05); padding:8px 15px; border-radius:15px;">No messages yet</p></div>`;
                return;
            }

            area.innerHTML = msgs.map(m => {
                const isMe = m.senderId === myId;
                let contentHtml = '';
                
                // 1. Quoted Message Block (if exists)
                if (m.replyTo) {
                    contentHtml += `
                        <div class="quoted-msg-container">
                            <span class="quoted-author">${m.replyTo.name}</span>
                            <span class="quoted-text">${m.replyTo.content}</span>
                        </div>
                    `;
                }

                // 2. Main Content
                if (m.type === 'image') contentHtml += `<img src="${m.content}">`;
                else if (m.type === 'document') contentHtml += m.content; // Doc HTML is pre-built
                else contentHtml += `<span>${m.content}</span>`;

                return `
                    <div class="message-row ${isMe ? 'sent' : 'received'}">
                        <div class="message">
                            ${contentHtml}
                            <span class="msg-time">${m.timestamp}</span>
                            
                            <div class="msg-dropdown-trigger" onclick="toggleMessageMenu(event, ${m.id})">
                                <i class="fas fa-chevron-down" style="font-size: 10px;"></i>
                            </div>

                            <div class="msg-context-menu" id="menu-${m.id}">
                                <div class="msg-menu-item" onclick="startReply(${m.id})">
                                    <i class="fas fa-reply"></i> Reply
                                </div>
                                <div class="msg-menu-item delete" onclick="deleteMessage(${m.id})">
                                    <i class="fas fa-trash-alt"></i> Delete
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            area.scrollTop = area.scrollHeight;
        }

        // --- REPLY LOGIC ---
        function toggleMessageMenu(e, msgId) {
            e.stopPropagation(); // Prevent closing immediately
            // Close all other menus first
            document.querySelectorAll('.msg-context-menu').forEach(el => el.classList.remove('show'));
            
            // Show this one
            const menu = document.getElementById(`menu-${msgId}`);
            if(menu) menu.classList.toggle('show');
        }

        function startReply(msgId) {
            const msgs = messageStore[activeReceiverId];
            const msg = msgs.find(m => m.id === msgId);
            if(!msg) return;

            replyingToMsg = msg;
            
            // Show Preview
            document.getElementById('replyPreview').style.display = 'flex';
            document.getElementById('replyTargetName').innerText = msg.name;
            
            let previewText = msg.content;
            if(msg.type === 'image') previewText = "📷 Photo";
            else if(msg.type === 'document') previewText = "📄 Document";
            
            document.getElementById('replyTargetText').innerText = previewText;
            document.getElementById('msgInput').focus();
            
            // Close menu
            document.querySelectorAll('.msg-context-menu').forEach(el => el.classList.remove('show'));
        }

        function cancelReply() {
            replyingToMsg = null;
            document.getElementById('replyPreview').style.display = 'none';
        }

        // --- SENDING MESSAGES ---
        function sendTextMessage() {
            if (!activeReceiverId) return alert("Select a contact");
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            addMessageToStore(text, 'text');
            input.value = '';
        }

        function addMessageToStore(content, type) {
            let replyData = null;
            
            // Create Simplified Reply Object
            if (replyingToMsg) {
                let cleanContent = replyingToMsg.content;
                if(replyingToMsg.type === 'image') cleanContent = "📷 Photo";
                if(replyingToMsg.type === 'document') cleanContent = "📄 Document";
                
                replyData = {
                    name: replyingToMsg.name,
                    content: cleanContent
                };
            }

            const newMsg = {
                id: Date.now(),
                senderId: myId,
                name: "You",
                type: type,
                content: content,
                replyTo: replyData, // Store reply info here
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            if (!messageStore[activeReceiverId]) messageStore[activeReceiverId] = [];
            messageStore[activeReceiverId].push(newMsg);
            
            cancelReply();
            renderMessages();
        }

        function handleEnter(e) { if (e.key === 'Enter') sendTextMessage(); }

        // --- DELETING MESSAGES ---
        function deleteMessage(msgId) {
            if(!confirm("Delete this message?")) return;
            messageStore[activeReceiverId] = messageStore[activeReceiverId].filter(m => m.id !== msgId);
            renderMessages();
        }
        
        function deleteChat() {
            if(confirm("Clear this chat?")) {
                messageStore[activeReceiverId] = [];
                renderMessages();
                document.getElementById('headerMenu').classList.remove('show');
            }
        }

        // --- MENU TOGGLES & OUTSIDE CLICKS ---
        function toggleHeaderMenu() { document.getElementById('headerMenu').classList.toggle('show'); }
        function toggleAttachmentMenu() { document.getElementById('attachmentMenu').classList.toggle('show'); }
        
        function triggerFile(type) {
            document.getElementById('attachmentMenu').classList.remove('show');
            if(type === 'image') document.getElementById('fileInputImage').click();
            else document.getElementById('fileInputDoc').click();
        }

        // Close all menus when clicking anywhere else
        document.addEventListener('click', function(e) {
            // Helper to close if click is outside target
            const closeIfOutside = (menuId, triggerClass) => {
                const menu = document.getElementById(menuId);
                if (menu && menu.classList.contains('show') && !e.target.closest('#' + menuId) && !e.target.closest('.' + triggerClass)) {
                    menu.classList.remove('show');
                }
            };

            closeIfOutside('headerMenu', 'btn-icon');
            closeIfOutside('attachmentMenu', 'btn-icon');
            
            // Special handling for message context menus (class based)
            if (!e.target.closest('.msg-context-menu') && !e.target.closest('.msg-dropdown-trigger')) {
                document.querySelectorAll('.msg-context-menu').forEach(el => el.classList.remove('show'));
            }
        });

        // --- FILE HANDLING ---
        function handleFileUpload(input, type) {
            if(!activeReceiverId) return;
            const file = input.files[0];
            if(!file) return;

            if(type === 'image') {
                const reader = new FileReader();
                reader.onload = (e) => addMessageToStore(e.target.result, 'image');
                reader.readAsDataURL(file);
            } else {
                const url = URL.createObjectURL(file);
                const html = `
                    <a href="${url}" download="${file.name}" style="text-decoration:none; display:flex; align-items:center; background:rgba(0,0,0,0.1); padding:10px; border-radius:6px; margin-top:5px;">
                        <i class="fas fa-file-alt" style="font-size:24px; color:#4facfe; margin-right:10px;"></i>
                        <div>
                            <div style="color:var(--text-main); font-weight:500; font-size:13px;">${file.name}</div>
                            <div style="color:var(--text-muted); font-size:11px;">${(file.size/1024).toFixed(0)} KB • Click to download</div>
                        </div>
                    </a>`;
                addMessageToStore(html, 'document');
            }
            input.value = '';
        }
    </script>

</body>
</html>
