<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - SkillUp</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo"><a href="index.html">SkillUp</a></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="container animate-fade" style="padding-top: 0">
        <div class="profile-header">
            <div class="avatar-large" id="avatarDisplay"></div>
            <h1 class="profile-name" id="userName">Loading...</h1>
            <p class="profile-email" id="userEmail">...</p>

            <div class="profile-actions" id="actionArea">
                <!-- Buttons injected here -->
            </div>

            <div class="profile-stats">
                <div class="stat-item">
                    <span class="stat-value" id="postCount">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value">0</span>
                    <span class="stat-label">Followers</span>
                </div>
                <!-- Placeholder for future stats -->
            </div>
        </div>

        <h3 style="margin-bottom: 1.5rem; text-align: center;">Recent Posts</h3>
        <div class="gig-grid" id="userPosts">
            <p style="text-align:center">Loading posts...</p>
        </div>
    </div>

    <!-- Post Modal -->
    <div id="postModal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div class="menu-container">
                <button class="menu-btn" onclick="toggleMenu()">&#x22EE;</button>
                <div class="dropdown-menu" id="dropdownMenu">
                    <!-- Populated by JS -->
                </div>
            </div>
            <div id="modalBody">
                <!-- Content goes here -->
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editProfileModal" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px">
            <button class="close-modal" onclick="closeEditModal()">&times;</button>
            <h2 style="margin-bottom: 1.5rem">Edit Profile</h2>
            <div class="form-group">
                <label for="editName">Full Name</label>
                <input type="text" id="editName" placeholder="Enter your name">
            </div>
            <button class="btn btn-primary" id="saveProfileBtn" style="width: 100%">Save Changes</button>
        </div>
    </div>

    <script src="toast.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const profileId = urlParams.get('userId');
        const myId = localStorage.getItem('userId');

        let profilePostsData = [];
        let currentPostId = null;

        function getInitials(name) {
            return name
                .split(' ')
                .map(word => word[0])
                .join('')
                .toUpperCase()
                .substring(0, 2);
        }

        function getColorFromName(name) {
            const colors = ['#1dbf73', '#ff4d4d', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = name.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        async function loadProfile() {
            if (!profileId) return;

            // Fetch User Details
            try {
                const res = await fetch(`/api/users/${profileId}`);
                const user = await res.json();

                document.getElementById('userName').innerText = user.name;
                document.getElementById('userEmail').innerText = user.email;

                // Set Avatar
                const initials = getInitials(user.name);
                const avatar = document.getElementById('avatarDisplay');
                avatar.innerText = initials;
                avatar.style.backgroundColor = getColorFromName(user.name);

                const actionArea = document.getElementById('actionArea');
                if (myId && myId !== profileId) {
                    actionArea.innerHTML = `<a href="chat.html?sellerId=${profileId}" class="btn btn-primary" style="min-width: 150px;">Message</a>`;
                } else if (myId === profileId) {
                    actionArea.innerHTML = `<button class="btn btn-outline" style="min-width: 150px; border-color: var(--primary); color: var(--primary);" onclick="openEditModal()">Edit Profile</button>`;
                }

            } catch (err) {
                console.error(err);
            }

            // Fetch User's Posts
            try {
                const res = await fetch(`/api/posts/user/${profileId}`);
                profilePostsData = await res.json(); // Store for modal
                const container = document.getElementById('userPosts');

                // Update post count
                document.getElementById('postCount').innerText = profilePostsData.length;

                if (profilePostsData.length === 0) {
                    container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted)">No posts to show yet.</p>';
                    container.style.display = 'block'; // Block display for text
                } else {
                    container.style.display = 'grid'; // Grid for posts
                    container.innerHTML = profilePostsData.map(post => `
                        <div class="gig-card" style="display:flex; flex-direction:column; cursor:pointer;" onclick="openPostModal('${post._id}')">
                            <div class="gig-content">
                                <div class="gig-title">${post.title}</div>
                                <small style="color:var(--primary)">${post.tags.join(', ')}</small>
                                <p style="font-size: 0.9rem; margin-top: 1rem; color: #ccc">${post.description.substring(0, 100)}...</p>
                                ${post.mediaUrl ? `<div style="margin-top:0.5rem; font-size:0.8rem; color:#888">[Has Media]</div>` : ''}
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error(err);
            }
        }

        // Modal Logic (Same as index.html essentially)
        function openPostModal(id) {
            const post = profilePostsData.find(p => p._id === id);
            if (!post) return;
            currentPostId = id;

            const modalBody = document.getElementById('modalBody');

            // Populate Content
            modalBody.innerHTML = `
                <h2>${post.title}</h2>
                <div style="margin: 0.5rem 0; color: var(--primary); font-weight: bold;">${post.tags.join(', ')}</div>
                <div style="margin-bottom: 1.5rem; color: var(--text-muted);">By ${post.authorName} | ${new Date(post.createdAt).toLocaleDateString()}</div>
                
                ${post.mediaUrl ? (
                    post.mediaType === 'video'
                        ? `<video controls src="${post.mediaUrl}" style="width:100%; border-radius:8px; max-height:500px; margin-bottom:1.5rem;"></video>`
                        : `<img src="${post.mediaUrl}" style="width:100%; border-radius:8px; object-fit:contain; max-height:500px; margin-bottom:1.5rem;">`
                ) : ''}

                <p style="font-size: 1.1rem; line-height: 1.8; white-space: pre-wrap;">${post.description}</p>
            `;

            // Setup Menu
            const dropdown = document.getElementById('dropdownMenu');
            dropdown.innerHTML = `<button class="dropdown-item" onclick="sharePost()">Share Link</button>`;

            if (myId === post.authorId) {
                dropdown.innerHTML += `<button class="dropdown-item text-danger" onclick="confirmDelete()">Delete Post</button>`;
            }

            document.getElementById('postModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('postModal').classList.remove('active');
            document.getElementById('dropdownMenu').classList.remove('show');
        }

        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        function sharePost() {
            const link = window.location.origin + '/#post-' + currentPostId;
            navigator.clipboard.writeText(`Check out this post on SkillUp: ${link}`).then(() => {
                showToast('Link copied to clipboard!', 'success');
            });
            toggleMenu();
        }

        async function confirmDelete() {
            if (!confirm('Are you sure you want to delete this post?')) return;

            try {
                const res = await fetch(`/api/posts/${currentPostId}`, { method: 'DELETE' });

                if (res.status === 401) {
                    showToast('Session expired. Please login again.', 'error');
                    localStorage.clear();
                    setTimeout(() => window.location.href = 'login.html', 1500);
                    return;
                }

                if (res.ok) {
                    showToast('Post deleted successfully', 'success');
                    closeModal();
                    loadProfile(); // Reload
                } else {
                    const data = await res.json();
                    showToast(data.error || 'Failed to delete', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error deleting post', 'error');
            }
        }

        // Close menu/modal when clicking outside
        window.onclick = function (event) {
            if (!event.target.matches('.menu-btn')) {
                const dropdowns = document.getElementsByClassName("dropdown-menu");
                for (let i = 0; i < dropdowns.length; i++) {
                    let openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
            if (event.target.classList.contains('modal-overlay')) {
                closeModal();
            }
        }

        // Edit Profile Logic
        function openEditModal() {
            const currentName = document.getElementById('userName').innerText;
            document.getElementById('editName').value = currentName;
            document.getElementById('editProfileModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editProfileModal').classList.remove('active');
        }

        async function saveProfile() {
            console.log('DEBUG: Save clicked');
            const newName = document.getElementById('editName').value.trim();
            const saveBtn = document.getElementById('saveProfileBtn');

            // Visual feedback
            const originalText = saveBtn.innerText;
            saveBtn.innerText = 'Saving...';
            saveBtn.disabled = true;

            if (!newName) {
                alert('Name cannot be empty');
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
                return;
            }

            try {
                // Ensure myId is present
                if (!myId) {
                    alert('Error: You are not logged in (User ID missing). Please login again.');
                    window.location.href = 'login.html';
                    return;
                }

                const res = await fetch(`/api/users/${myId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });

                if (res.status === 401) {
                    alert('Session expired. Please login again.');
                    localStorage.clear();
                    window.location.href = 'login.html';
                    return;
                }

                if (res.ok) {
                    showToast('Profile updated!', 'success'); // Assuming toast works, but alert as backup if needed
                    setTimeout(() => {
                        closeEditModal();
                        loadProfile();
                        saveBtn.innerText = originalText;
                        saveBtn.disabled = false;
                    }, 500);
                } else {
                    const data = await res.json();
                    alert('Update failed: ' + (data.error || 'Unknown error'));
                    saveBtn.innerText = originalText;
                    saveBtn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Network error: ' + err.message);
                saveBtn.innerText = originalText;
                saveBtn.disabled = false;
            }
        }

        // Attach Event Listener
        document.getElementById('saveProfileBtn').addEventListener('click', saveProfile);

        loadProfile();
    </script>
</body>

</html>
