<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Skill/Achievement - SkillUp</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo"><a href="index.html">SkillUp</a></div>
        <nav>
            <ul>
                <li><a href="index.html">Back to Feed</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="auth-box animate-fade" style="max-width: 600px">
            <h2>Share Achievement / Skill</h2>
            <form id="postForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="title" placeholder="e.g. Mastered React.js or Completed 50 Graphic Designs"
                        required>
                </div>
                <div class="form-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="tags" placeholder="React, Design, Adobe...">
                </div>
                <div class="form-group">
                    <label>Description / Story</label>
                    <textarea id="description" rows="5" placeholder="Tell us about what you achieved..."
                        required></textarea>
                </div>
                <div class="form-group">
                    <label>Upload Image or Video (Optional)</label>
                    <input type="file" id="media" accept="image/*,video/*">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Post to Feed</button>
            </form>
        </div>
    </div>

    <script src="toast.js"></script>
    <script>
        const userId = localStorage.getItem('userId');
        const userEmail = localStorage.getItem('userEmail');
        const userName = localStorage.getItem('userName');

        // Protect route
        if (!userId) {
            showToast('You must be logged in!', 'error');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 2000);
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!userId) {
                showToast('You must be logged in!', 'error');
                return;
            }

            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            // Send tags as comma-separated string for Multer backend to split
            const tags = document.getElementById('tags').value;
            // The 'price' field is not present in the HTML, but included in the provided edit.
            // For now, it will be undefined or an empty string if not added to the form.
            const price = document.getElementById('price') ? document.getElementById('price').value : '';

            const mediaInput = document.getElementById('media');

            const formData = new FormData();
            formData.append('title', title);
            formData.append('description', description);
            formData.append('tags', tags);
            formData.append('authorId', userId);
            formData.append('authorName', userName);
            formData.append('authorEmail', userEmail);
            if (price) formData.append('price', price);

            if (mediaInput.files.length > 0) {
                formData.append('media', mediaInput.files[0]);
            }

            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Posting...';

            try {
                const res = await fetch('/api/posts/create', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    showToast('Posted successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showToast('Error posting', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Post to Feed';
                }
            } catch (err) {
                console.error(err);
                showToast('Error posting', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Post to Feed';
            }
        });
    </script>
</body>

</html>
