<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillUp</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="logo"><a href="index.html">SkillUp</a></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="auth-box animate-fade">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Log In</button>
            </form>
            <p style="margin-top: 1rem; text-align: center; color: var(--text-muted)">
                Don't have an account? <a href="register.html" style="color: var(--primary)">Register</a>
            </p>
        </div>
    </div>

    <script src="toast.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('userId', data.user._id);
                    localStorage.setItem('userEmail', data.user.email);
                    localStorage.setItem('userName', data.user.name);
                    showToast('Login successful', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000); // Slight delay to show toast
                } else {
                    showToast(data.error || 'Login failed', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('An error occurred', 'error');
            }
        });
    </script>
</body>

</html>
